name: ORB quality and immutable build

on:
  pull_request:
  push:
    branches: [001-orb-trade-operations]
  workflow_dispatch:
    inputs:
      acceptance_base_url:
        description: HTTPS URL of the owner-approved deployed acceptance target
        required: true
        type: string
      approved_release_commit:
        description: Full 40-character commit of the owner-approved release candidate
        required: true
        type: string
      owner_uat_authorized:
        description: Owner explicitly authorized this UAT run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack prepare pnpm@12.16.1 --activate
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Generate Prisma client
        run: pnpm run prisma:generate
      - name: Reject generated source drift
        run: git diff --exit-code
      - run: pnpm run typecheck
      - name: Unit, contract, and architecture tests
        run: node --test --experimental-test-coverage tests/unit/**/*.test.ts tests/contract/**/*.test.ts tests/architecture/**/*.test.ts
      - name: Integration tests
        run: node --test tests/integration/**/*.test.ts
      - name: Verify recorded schema and seed baseline
        run: node scripts/verify-schema-seed-baseline.mjs --verify
      - name: Dependency security scan
        shell: bash
        run: |
          pnpm audit --prod --json > "$RUNNER_TEMP/pnpm-audit.json" || true
          node scripts/verify-build-manifest.mjs --assert-audit "$RUNNER_TEMP/pnpm-audit.json"

  isolated-infrastructure:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack prepare pnpm@12.16.1 --activate
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Real PostgreSQL migration, encrypted backup and isolated restore gate
        run: ops/acceptance/run-isolated-infrastructure-gate.sh
      - name: Preceding-app rollback rehearsal against expanded schema
        run: ops/acceptance/run-application-rollback-gate.sh

  local-browser:
    needs: [offline, isolated-infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORB_TEST_MANAGED_SERVER: "1"
      ORB_TEST_AUTH: "1"
      ORB_TEST_BASE_URL: http://127.0.0.1:3000
      ORB_APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack prepare pnpm@12.16.1 --activate
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm run prisma:generate
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Acceptance against CI-owned local application
        run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-browser-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  deployed-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.owner_uat_authorized == true
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: owner-acceptance
    env:
      ORB_TEST_BASE_URL: ${{ inputs.acceptance_base_url }}
      ORB_APPROVED_RELEASE_COMMIT: ${{ inputs.approved_release_commit }}
      ORB_OWNER_UAT_AUTHORIZATION: OWNER_APPROVED
      ORB_OWNER_UAT_EVIDENCE_DIR: ${{ runner.temp }}/owner-uat-evidence
    steps:
      - name: Validate approved release commit input
        shell: bash
        run: |
          [[ "$ORB_APPROVED_RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || {
            echo "approved release commit must be a full lowercase SHA-1" >&2
            exit 2
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_release_commit }}
      - name: Verify exact approved release checkout
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$ORB_APPROVED_RELEASE_COMMIT" ]] || {
            echo "owner UAT checkout does not match the approved release candidate commit" >&2
            exit 2
          }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "owner UAT checkout must be clean before dependency installation" >&2
            exit 2
          }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack prepare pnpm@12.16.1 --activate
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - name: Bilingual owner-UAT technical gate
        run: ops/acceptance/run-owner-uat-gate.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: owner-uat-evidence
          path: ${{ runner.temp }}/owner-uat-evidence
          if-no-files-found: error
          retention-days: 14

  immutable-build:
    needs: [offline, local-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack prepare pnpm@12.16.1 --activate
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm run prisma:generate
      - run: pnpm run build
      - name: Create and verify immutable digest manifest
        run: |
          node scripts/verify-build-manifest.mjs --write "$RUNNER_TEMP/orb-build-manifest.json"
          node scripts/verify-build-manifest.mjs --verify "$RUNNER_TEMP/orb-build-manifest.json"
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: orb-build-manifest
          path: ${{ runner.temp }}/orb-build-manifest.json
          if-no-files-found: error
          retention-days: 14
