openapi: 3.1.0
info:
  title: ORB Release 1 Operational Beta API
  version: 1.0.0-beta-plan
  description: Authoritative Release 1 API. Deferred features have no paths. Cookie sessions use __Host-orb_session with Secure,
    HttpOnly, Path=/ and SameSite=Strict; no Domain attribute. The server fails closed on missing/mismatched Origin and Referer
    for cookie-authenticated mutations, requires a session-bound X-CSRF-Token, rotates both session and CSRF tokens at sign-in,
    privilege change and reauthentication, expires idle sessions after 30 minutes and absolute sessions after 12 hours, and
    invalidates both tokens on logout or revocation.
servers:
- url: /api/v1
security:
- sessionCookie: []
tags:
- name: Recovery
  description: Recovery operations in the fixed Release 1 pilot.
- name: Access
  description: Access operations in the fixed Release 1 pilot.
- name: Masters
  description: Masters operations in the fixed Release 1 pilot.
- name: Projects
  description: Projects operations in the fixed Release 1 pilot.
- name: Contracts
  description: Contracts operations in the fixed Release 1 pilot.
- name: Shipments
  description: Shipments operations in the fixed Release 1 pilot.
- name: Routes
  description: Routes operations in the fixed Release 1 pilot.
- name: Evidence
  description: Evidence operations in the fixed Release 1 pilot.
- name: Documents
  description: Documents operations in the fixed Release 1 pilot.
- name: Approvals
  description: Approvals operations in the fixed Release 1 pilot.
- name: SupplierInvoices
  description: SupplierInvoices operations in the fixed Release 1 pilot.
- name: Money
  description: Money operations in the fixed Release 1 pilot.
- name: Expenses
  description: Expenses operations in the fixed Release 1 pilot.
- name: Statements
  description: Statements operations in the fixed Release 1 pilot.
- name: Claims
  description: Claims operations in the fixed Release 1 pilot.
- name: Closure
  description: Closure operations in the fixed Release 1 pilot.
- name: Audit
  description: Audit operations in the fixed Release 1 pilot.
paths:
  /masters/{masterType}:
    parameters:
    - $ref: '#/components/parameters/MasterType'
    get:
      tags:
      - Masters
      operationId: listMasterRecords
      responses:
        '200':
          $ref: '#/components/responses/EntityPage'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: List master records
    post:
      tags:
      - Masters
      operationId: createMasterRecord
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/EntityInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create master record
  /masters/{masterType}/{recordId}:
    parameters:
    - $ref: '#/components/parameters/MasterType'
    - $ref: '#/components/parameters/RecordId'
    patch:
      tags:
      - Masters
      operationId: updateMasterRecord
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/EntityInput'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Update master record
  /projects:
    get:
      tags:
      - Projects
      operationId: listProjects
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/EntityPage'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: List projects
    post:
      tags:
      - Projects
      operationId: createProjectWithSalesContract
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create project with sales contract
  /projects/{projectId}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
      - Projects
      operationId: getProject
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: Get project
  /projects/{projectId}/purchase-contracts:
    post:
      tags:
      - Contracts
      operationId: createPurchaseContract
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ContractInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create purchase contract
  /contracts/{contractId}/lines:
    get:
      tags: [Contracts]
      operationId: listContractLines
      parameters:
      - $ref: '#/components/parameters/ContractId'
      responses:
        '200': { $ref: '#/components/responses/EntityPage' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: List current contract lines
    post:
      tags: [Contracts]
      operationId: createContractLine
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractLineInput' }
      responses:
        '201': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Create a stable contract line in a draft contract version
  /contracts/{contractId}/lines/{lineId}:
    get:
      tags: [Contracts]
      operationId: getContractLine
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - name: lineId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: Read a contract line and its current version
    patch:
      tags: [Contracts]
      operationId: updateContractLine
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - name: lineId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractLineInput' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Append line facts to a new draft contract version
  /contracts/{contractId}/lines/{lineId}/versions:
    get:
      tags: [Contracts]
      operationId: listContractLineVersions
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - name: lineId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/EntityPage' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: List immutable contract line version history
  /contracts/{contractId}/amendments:
    post:
      tags:
      - Contracts
      operationId: createContractAmendment
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ContractInput'
              - type: object
                required:
                - reason
                - effectiveDate
                properties:
                  reason:
                    type: string
                    minLength: 3
                  effectiveDate:
                    type: string
                    format: date
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create contract amendment
  /contracts/{contractId}/submit:
    post:
      tags:
      - Contracts
      operationId: submitContractForApproval
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Submit contract for approval
  /projects/{projectId}/supplier-shipments:
    post:
      tags:
      - Shipments
      operationId: createSupplierShipment
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/SupplierShipmentCreateInput'
      responses:
        '201':
          description: Typed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierShipmentWorkspace'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create supplier shipment
  /supplier-shipments/{shipmentId}/submit:
    post:
      tags:
      - Shipments
      operationId: submitSupplierShipmentConfirmation
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Submit supplier shipment confirmation
  /supplier-shipments/{shipmentId}/confirm:
    post:
      tags:
      - Shipments
      operationId: confirmSupplierShipment
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBinding'
      responses:
        '200':
          description: Typed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierShipmentWorkspace'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Confirm supplier shipment
  /projects/{projectId}/sales-shipments:
    post:
      tags:
      - Shipments
      operationId: createSalesShipment
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/SalesShipmentCreateInput'
      responses:
        '201':
          description: Typed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesShipmentWorkspace'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create sales shipment
  /sales-shipments/{shipmentId}/primary-source:
    put:
      tags:
      - Shipments
      operationId: setPrimarySupplierSource
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - supplierShipmentId
              properties:
                supplierShipmentId:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Typed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesShipmentWorkspace'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Set primary supplier source
  /sales-shipments/{shipmentId}/tolerance-exceptions:
    post:
      tags:
      - Approvals
      operationId: requestToleranceException
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - breachedFields
              properties:
                reason:
                  type: string
                  minLength: 3
                breachedFields:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Request tolerance exception
  /sales-shipments/{shipmentId}/confirm:
    post:
      tags:
      - Shipments
      operationId: confirmSalesShipment
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBinding'
      responses:
        '200':
          description: Typed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesShipmentWorkspace'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Confirm sales shipment
  /sales-shipments/{shipmentId}/route-checklist:
    get:
      tags:
      - Routes
      operationId: getFixedRouteChecklist
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: Get fixed route checklist
  /sales-shipments/{shipmentId}/route-items/{itemId}:
    patch:
      tags:
      - Routes
      operationId: updateRouteEvidenceOrMilestone
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                  - IN_PROGRESS
                  - SATISFIED
                evidenceId:
                  $ref: '#/components/schemas/Uuid'
                milestoneAt:
                  type: string
                  format: date-time
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Update route evidence or milestone
  /evidence:
    post:
      tags:
      - Evidence
      operationId: uploadEvidence
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Content-SHA256
        in: header
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - subjectType
              - subjectId
              - purpose
              properties:
                file:
                  type: string
                  format: binary
                subjectType:
                  type: string
                subjectId:
                  $ref: '#/components/schemas/Uuid'
                purpose:
                  type: string
      responses:
        '201':
          description: Immutable uploaded evidence metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceMetadata'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Upload evidence
  /evidence/{evidenceId}:
    get:
      tags:
      - Evidence
      operationId: getEvidenceMetadata
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Immutable evidence metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceMetadata'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: Get evidence metadata
  /evidence/{evidenceId}/content:
    get:
      tags:
      - Evidence
      operationId: viewOrDownloadEvidence
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      - name: disposition
        in: query
        schema:
          type: string
          enum:
          - inline
          - attachment
          default: inline
      responses:
        '200':
          description: Authorized immutable bytes; access is audited
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: View or download evidence
  /sales-shipments/{shipmentId}/documents:
    post:
      tags:
      - Documents
      operationId: generateShipmentDocument
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDocument'
      responses:
        '202':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Generate shipment document
  /documents/{documentId}/status:
    get:
      tags:
      - Documents
      operationId: getDocumentGenerationStatus
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: Get document generation status
  /documents/{documentId}/revisions:
    post:
      tags:
      - Documents
      operationId: reviseDocument
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Revise document
  /documents/{documentId}/submit:
    post:
      tags:
      - Documents
      operationId: submitDocumentForApproval
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Submit document for approval
  /documents/{documentId}/cancel:
    post:
      tags:
      - Documents
      operationId: cancelDocumentRevision
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Cancel document revision
  /documents/{documentId}/outbound-manifests:
    post:
      tags:
      - Documents
      operationId: createOutboundManifest
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundManifestInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create outbound manifest
  /outbound-manifests/{manifestId}/submit:
    post:
      tags:
      - Documents
      operationId: submitOutboundManifestForApproval
      parameters:
      - $ref: '#/components/parameters/ManifestId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Submit outbound manifest for approval
  /outbound-manifests/{manifestId}/send:
    post:
      tags:
      - Documents
      operationId: sendApprovedOutboundManifest
      parameters:
      - $ref: '#/components/parameters/ManifestId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBinding'
      responses:
        '201':
          description: Immutable send attempt/result; retries create another attempt and never mutate approved bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAttempt'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Send approved outbound manifest
  /outbound-manifests/{manifestId}/cancel:
    post:
      tags:
      - Documents
