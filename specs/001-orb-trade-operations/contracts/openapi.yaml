openapi: 3.1.0
info:
  title: ORB Release 1 Operational Beta API
  version: 1.0.0-beta-plan
  description: Authoritative Release 1 API. Deferred features have no paths.
servers:
- url: /api/v1
security:
- sessionCookie: []
tags:
- name: Recovery
- name: Access
- name: Masters
- name: Projects
- name: Contracts
- name: Shipments
- name: Routes
- name: Evidence
- name: Documents
- name: Approvals
- name: SupplierInvoices
- name: Money
- name: Expenses
- name: Statements
- name: Claims
- name: Closure
- name: Audit
paths:
  /masters/{masterType}:
    parameters:
    - $ref: '#/components/parameters/MasterType'
    get:
      tags:
      - Masters
      operationId: listMasterRecords
      responses:
        '200':
          $ref: '#/components/responses/EntityPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Masters
      operationId: createMasterRecord
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EntityInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /masters/{masterType}/{recordId}:
    parameters:
    - $ref: '#/components/parameters/MasterType'
    - $ref: '#/components/parameters/RecordId'
    patch:
      tags:
      - Masters
      operationId: updateMasterRecord
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EntityInput'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /projects:
    get:
      tags:
      - Projects
      operationId: listProjects
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/EntityPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Projects
      operationId: createProjectWithSalesContract
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
      - Projects
      operationId: getProject
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/purchase-contracts:
    post:
      tags:
      - Contracts
      operationId: createPurchaseContract
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ContractInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /contracts/{contractId}/amendments:
    post:
      tags:
      - Contracts
      operationId: createContractAmendment
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ContractInput'
              - type: object
                required:
                - reason
                - effectiveDate
                properties:
                  reason:
                    type: string
                    minLength: 3
                  effectiveDate:
                    type: string
                    format: date
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /contracts/{contractId}/submit:
    post:
      tags:
      - Contracts
      operationId: submitContractForApproval
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/supplier-shipments:
    post:
      tags:
      - Shipments
      operationId: createSupplierShipment
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ShipmentInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /supplier-shipments/{shipmentId}/submit:
    post:
      tags:
      - Shipments
      operationId: submitSupplierShipmentConfirmation
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /supplier-shipments/{shipmentId}/confirm:
    post:
      tags:
      - Shipments
      operationId: confirmSupplierShipment
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBinding'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/sales-shipments:
    post:
      tags:
      - Shipments
      operationId: createSalesShipment
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ShipmentInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /sales-shipments/{shipmentId}/primary-source:
    put:
      tags:
      - Shipments
      operationId: setPrimarySupplierSource
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - supplierShipmentId
              properties:
                supplierShipmentId:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /sales-shipments/{shipmentId}/tolerance-exceptions:
    post:
      tags:
      - Approvals
      operationId: requestToleranceException
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - breachedFields
              properties:
                reason:
                  type: string
                  minLength: 3
                breachedFields:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /sales-shipments/{shipmentId}/confirm:
    post:
      tags:
      - Shipments
      operationId: confirmSalesShipment
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBinding'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /sales-shipments/{shipmentId}/route-checklist:
    get:
      tags:
      - Routes
      operationId: getFixedRouteChecklist
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /sales-shipments/{shipmentId}/route-items/{itemId}:
    patch:
      tags:
      - Routes
      operationId: updateRouteEvidenceOrMilestone
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                  - IN_PROGRESS
                  - SATISFIED
                evidenceId:
                  $ref: '#/components/schemas/Uuid'
                milestoneAt:
                  type: string
                  format: date-time
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /evidence:
    post:
      tags:
      - Evidence
      operationId: uploadEvidence
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Content-SHA256
        in: header
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - subjectType
              - subjectId
              - purpose
              properties:
                file:
                  type: string
                  format: binary
                subjectType:
                  type: string
                subjectId:
                  $ref: '#/components/schemas/Uuid'
                purpose:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /evidence/{evidenceId}:
    get:
      tags:
      - Evidence
      operationId: getEvidenceMetadata
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /evidence/{evidenceId}/content:
    get:
      tags:
      - Evidence
      operationId: viewOrDownloadEvidence
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      - name: disposition
        in: query
        schema:
          type: string
          enum:
          - inline
          - attachment
          default: inline
      responses:
        '200':
          description: Authorized immutable bytes; access is audited
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /sales-shipments/{shipmentId}/documents:
    post:
      tags:
      - Documents
      operationId: generateShipmentDocument
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDocument'
      responses:
        '202':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /documents/{documentId}/status:
    get:
      tags:
      - Documents
      operationId: getDocumentGenerationStatus
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /documents/{documentId}/revisions:
    post:
      tags:
      - Documents
      operationId: reviseDocument
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /documents/{documentId}/submit:
    post:
      tags:
      - Documents
      operationId: submitDocumentForApproval
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /documents/{documentId}/cancel:
    post:
      tags:
      - Documents
      operationId: cancelDocumentRevision
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /documents/{documentId}/outbound-manifests:
    post:
      tags:
      - Documents
      operationId: createOutboundManifest
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundManifestInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /outbound-manifests/{manifestId}/submit:
    post:
      tags:
      - Documents
      operationId: submitOutboundManifestForApproval
      parameters:
      - $ref: '#/components/parameters/ManifestId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /outbound-manifests/{manifestId}/send:
    post:
      tags:
      - Documents
      operationId: sendApprovedOutboundManifest
      parameters:
      - $ref: '#/components/parameters/ManifestId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBinding'
      responses:
        '201':
          description: Immutable send attempt/result; retries create another attempt and never mutate approved bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAttempt'
        default:
          $ref: '#/components/responses/Problem'
  /outbound-manifests/{manifestId}/cancel:
    post:
      tags:
      - Documents
      operationId: cancelOutboundManifest
      parameters:
      - $ref: '#/components/parameters/ManifestId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /approvals:
    get:
      tags:
      - Approvals
      operationId: listFixedApprovalInbox
      responses:
        '200':
          $ref: '#/components/responses/EntityPage'
        default:
          $ref: '#/components/responses/Problem'
  /approvals/{approvalId}/decision:
    post:
      tags:
      - Approvals
      operationId: decideFixedApproval
      parameters:
      - $ref: '#/components/parameters/ApprovalId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /supplier-shipments/{shipmentId}/invoices:
    post:
      tags:
      - SupplierInvoices
      operationId: createSupplierInvoice
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /supplier-invoices/{invoiceId}/submit:
    post:
      tags:
      - SupplierInvoices
      operationId: submitSupplierInvoice
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /supplier-invoices/{invoiceId}/confirm:
    post:
      tags:
      - SupplierInvoices
      operationId: confirmSupplierInvoice
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBinding'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/money-movements:
    post:
      tags:
      - Money
      operationId: recordMoneyMovement
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyMovementInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /money-movements/{movementId}/allocations:
    post:
      tags:
      - Money
      operationId: allocateMoneyMovement
      parameters:
      - $ref: '#/components/parameters/MovementId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementAllocationInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /money-movements/{movementId}/reverse:
    post:
      tags:
      - Money
      operationId: reverseMoneyMovement
      parameters:
      - $ref: '#/components/parameters/MovementId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/expenses:
    post:
      tags:
      - Expenses
      operationId: createDirectExpense
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectExpenseInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /expenses/{expenseId}/submit:
    post:
      tags:
      - Expenses
      operationId: submitDirectExpense
      parameters:
      - $ref: '#/components/parameters/ExpenseId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /statements/{statementType}/{subjectId}:
    get:
      tags:
      - Statements
      operationId: getOperationalStatement
      parameters:
      - $ref: '#/components/parameters/StatementType'
      - $ref: '#/components/parameters/SubjectId'
      - name: asOf
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Currency-partitioned source-linked operational statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/profit:
    get:
      tags:
      - Statements
      operationId: getProjectMarginAndCash
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Four separate formula-disclosed measures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitView'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/claims:
    post:
      tags:
      - Claims
      operationId: openSimpleClaim
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /claims/{claimId}/transition:
    post:
      tags:
      - Claims
      operationId: moveClaimUnderReview
      parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - toState
              - reason
              properties:
                toState:
                  type: string
                  enum:
                  - UNDER_REVIEW
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
  /claims/{claimId}/submit-outcome:
    post:
      tags:
      - Claims
      operationId: submitClaimOutcomeForApproval
      parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ClaimOutcomeInput'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/closure-assessment:
    post:
      tags:
      - Closure
      operationId: assessProjectClosure
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Current reproducible assessment with every blocker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureAssessment'
        default:
          $ref: '#/components/responses/Problem'
  /projects/{projectId}/closure-exceptions:
    post:
      tags:
      - Closure
      operationId: requestClosureException
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
