openapi: 3.1.0
info:
  title: ORB Release 1 Operational Beta API
  version: 1.0.0-beta-plan
  description: Authoritative Release 1 API. Deferred features have no paths. Cookie sessions use __Host-orb_session with Secure,
    HttpOnly, Path=/ and SameSite=Strict; no Domain attribute. The server fails closed on missing/mismatched Origin and Referer
    for cookie-authenticated mutations, requires a session-bound X-CSRF-Token, rotates both session and CSRF tokens at sign-in,
    privilege change and reauthentication, expires idle sessions after 30 minutes and absolute sessions after 12 hours, and
    invalidates both tokens on logout or revocation.
servers:
- url: /api/v1
security:
- sessionCookie: []
tags:
- name: Recovery
  description: Recovery operations in the fixed Release 1 pilot.
- name: Access
  description: Access operations in the fixed Release 1 pilot.
- name: Masters
  description: Masters operations in the fixed Release 1 pilot.
- name: Projects
  description: Projects operations in the fixed Release 1 pilot.
- name: Contracts
  description: Contracts operations in the fixed Release 1 pilot.
- name: Shipments
  description: Shipments operations in the fixed Release 1 pilot.
- name: Routes
  description: Routes operations in the fixed Release 1 pilot.
- name: Evidence
  description: Evidence operations in the fixed Release 1 pilot.
- name: Documents
  description: Documents operations in the fixed Release 1 pilot.
- name: Approvals
  description: Approvals operations in the fixed Release 1 pilot.
- name: SupplierInvoices
  description: SupplierInvoices operations in the fixed Release 1 pilot.
- name: Money
  description: Money operations in the fixed Release 1 pilot.
- name: Expenses
  description: Expenses operations in the fixed Release 1 pilot.
- name: Statements
  description: Statements operations in the fixed Release 1 pilot.
- name: Claims
  description: Claims operations in the fixed Release 1 pilot.
- name: Closure
  description: Closure operations in the fixed Release 1 pilot.
- name: Audit
  description: Audit operations in the fixed Release 1 pilot.
paths:
  /settings:
    get:
      tags: [Audit]
      operationId: getSettings
      summary: Read non-secret organization settings
      responses:
        '200':
          description: Current versioned settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN]
    patch:
      tags: [Audit]
      operationId: updateSettings
      summary: Update settings and append immutable audit history
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200':
          description: Updated versioned settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN]
  /reports/{reportType}:
    get:
      tags: [Statements]
      operationId: runOperationalReport
      summary: Run a filtered operational pilot report
      parameters:
      - name: reportType
        in: path
        required: true
        schema:
          type: string
          enum: [contract-fulfillment, accounts, project-profitability, product-movement]
      - name: projectId
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: productId
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: from
        in: query
        required: false
        schema: { type: string, format: date }
      - name: to
        in: query
        required: false
        schema: { type: string, format: date }
      responses:
        '200':
          description: Deterministic operational report rows and exact-decimal summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalReportResult' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, FINANCE_VIEWER]
  /company/document-profile:
    get:
      tags: [Statements]
      operationId: getDocumentProfile
      summary: Read the company details printed on documents
      responses:
        '200':
          description: Company name, address, tax and bank details, document design and logo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyProfile' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
  /accounts/summary:
    get:
      tags: [Statements]
      operationId: getAccountsSummary
      summary: Get operational Accounts summary
      parameters:
      - name: projectId
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Operational Accounts totals partitioned by currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsSummary' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, FINANCE_VIEWER]
  /accounts/{recordType}:
    get:
      tags: [Statements]
      operationId: listAccountRecords
      summary: List operational Accounts records
      parameters:
      - name: recordType
        in: path
        required: true
        schema:
          type: string
          enum: [sales-invoices, supplier-invoices, collections, supplier-payments, expenses]
      - name: projectId
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Type-scoped operational Accounts records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountRecordPage' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, FINANCE_VIEWER]
  /customers:
    get:
      tags: [Masters]
      operationId: listCustomers
      responses:
        '200':
          description: Customer directory
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Party' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: List customers
    post:
      tags: [Masters]
      operationId: createCustomer
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyInput' }
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Create customer
  /customers/{customerId}:
    parameters:
    - name: customerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [Masters]
      operationId: getCustomer
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: Get customer
    patch:
      tags: [Masters]
      operationId: updateCustomer
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyPatch' }
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Update or archive customer
  /suppliers:
    get:
      tags: [Masters]
      operationId: listSuppliers
      responses:
        '200':
          description: Supplier directory
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Party' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: List suppliers
    post:
      tags: [Masters]
      operationId: createSupplier
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyInput' }
      responses:
        '201':
          description: Supplier created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Create supplier
  /suppliers/{supplierId}:
    parameters:
    - name: supplierId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [Masters]
      operationId: getSupplier
      responses:
        '200':
          description: Supplier detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: Get supplier
    patch:
      tags: [Masters]
      operationId: updateSupplier
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyPatch' }
      responses:
        '200':
          description: Supplier updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Update or archive supplier
  /masters/{masterType}:
    parameters:
    - $ref: '#/components/parameters/MasterType'
    get:
      tags:
      - Masters
      operationId: listMasterRecords
      responses:
        '200':
          $ref: '#/components/responses/EntityPage'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: List master records
    post:
      tags:
      - Masters
      operationId: createMasterRecord
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/EntityInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create master record
  /masters/{masterType}/{recordId}:
    parameters:
    - $ref: '#/components/parameters/MasterType'
    - $ref: '#/components/parameters/RecordId'
    patch:
      tags:
      - Masters
      operationId: updateMasterRecord
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/EntityInput'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Update master record
  /products:
    get:
      tags: [Masters]
      operationId: listProducts
      responses:
        '200': { $ref: '#/components/responses/EntityPage' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: List tenant products
    post:
      tags: [Masters]
      operationId: createProduct
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Create tenant product
  /products/{productId}:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Masters]
      operationId: getProduct
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: Get tenant product
    patch:
      tags: [Masters]
      operationId: updateProduct
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Update product specification or lifecycle status
  /products/{productId}/movements:
    get:
      tags: [Masters]
      operationId: listProductMovements
      parameters:
      - $ref: '#/components/parameters/ProductId'
      - name: projectId
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Cross-project product traceability without stock balance or inventory valuation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMovementPage' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: List product movement traceability across projects
  /projects:
    get:
      tags:
      - Projects
      operationId: listProjects
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/EntityPage'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: List projects
    post:
      tags:
      - Projects
      operationId: createProjectWithSalesContract
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create project with sales contract
  /projects/{projectId}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
      - Projects
      operationId: getProject
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      - FINANCE_VIEWER
      summary: Get project
  /projects/{projectId}/activate:
    post:
      tags: [Projects]
      operationId: activateProject
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Start active project planning after saving a purchase contract; approvals remain required before execution
  /projects/{projectId}/purchase-contracts:
    post:
      tags:
      - Contracts
      operationId: createPurchaseContract
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ContractInput'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create purchase contract
  /contracts/{contractId}/lines:
    get:
      tags: [Contracts]
      operationId: listContractLines
      parameters:
      - $ref: '#/components/parameters/ContractId'
      responses:
        '200': { $ref: '#/components/responses/EntityPage' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: List current contract lines
    post:
      tags: [Contracts]
      operationId: createContractLine
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractLineInput' }
      responses:
        '201': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Create a stable contract line in a draft contract version
  /contracts/{contractId}/lines/{lineId}:
    get:
      tags: [Contracts]
      operationId: getContractLine
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - name: lineId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: Read a contract line and its current version
    patch:
      tags: [Contracts]
      operationId: updateContractLine
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - name: lineId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractLineInput' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS]
      summary: Append line facts to a new draft contract version
  /contracts/{contractId}/lines/{lineId}/versions:
    get:
      tags: [Contracts]
      operationId: listContractLineVersions
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - name: lineId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/EntityPage' }
        default: { $ref: '#/components/responses/Problem' }
      x-required-roles: [OWNER_ADMIN, OPERATIONS, FINANCE_VIEWER]
      summary: List immutable contract line version history
  /contracts/{contractId}/amendments:
    post:
      tags:
      - Contracts
      operationId: createContractAmendment
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ContractInput'
              - type: object
                required:
                - reason
                - effectiveDate
                properties:
                  reason:
                    type: string
                    minLength: 3
                  effectiveDate:
                    type: string
                    format: date
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create contract amendment
  /contracts/{contractId}/submit:
    post:
      tags:
      - Contracts
      operationId: submitContractForApproval
      parameters:
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Submit contract for approval
  /projects/{projectId}/supplier-shipments:
    post:
      tags:
      - Shipments
      operationId: createSupplierShipment
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/SupplierShipmentCreateInput'
      responses:
        '201':
          description: Typed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierShipmentWorkspace'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Create supplier shipment
  /supplier-shipments/{shipmentId}/submit:
    post:
      tags:
      - Shipments
      operationId: submitSupplierShipmentConfirmation
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Approval'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Submit supplier shipment confirmation
  /supplier-shipments/{shipmentId}/confirm:
    post:
      tags:
      - Shipments
      operationId: confirmSupplierShipment
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBinding'
      responses:
        '200':
          description: Typed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierShipmentWorkspace'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
      - OPERATIONS
      summary: Confirm supplier shipment
  /projects/{projectId}/sales-shipments:
    post:
      tags:
      - Shipments
      operationId: createSalesShipment
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/SalesShipmentCreateInput'
      responses:
        '201':
          description: Typed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesShipmentWorkspace'
        default:
          $ref: '#/components/responses/Problem'
      x-required-roles:
      - OWNER_ADMIN
