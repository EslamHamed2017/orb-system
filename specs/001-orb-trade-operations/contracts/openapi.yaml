components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-orb_session
      description: Secure HttpOnly __Host- cookie; SameSite=Strict, Path=/, no Domain; rotation and expiry are defined by
        x-cookie-auth-policy.
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ManifestId:
      name: manifestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MovementId:
      name: movementId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MasterType:
      name: masterType
      in: path
      required: true
      schema:
        type: string
        enum:
        - customers
        - suppliers
        - coffee
        - currencies
        - expense-categories
    StatementType:
      name: statementType
      in: path
      required: true
      schema:
        type: string
        enum:
        - customer
        - supplier
        - sales-shipment
        - supplier-shipment
        - project
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current aggregate version
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RestoreTestId:
      name: restoreTestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Unpredictable token bound to the authenticated session; required with Origin/Referer fail-closed validation.
      schema:
        type: string
        minLength: 32
        maxLength: 256
  requestBodies:
    EntityInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: true
    ContractLineInput:
      type: object
      additionalProperties: false
      required:
      - contractVersionId
      - coffeeSpecificationId
      - quantity
      - unitPrice
      - currency
      - incoterm
      - namedPlace
      - quantityToleranceUnder
      - quantityToleranceOver
      - paymentTerms
      - documentTerms
      properties:
        contractVersionId: { $ref: '#/components/schemas/Uuid' }
        coffeeSpecificationId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        unitPrice: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/Currency' }
        incoterm: { type: string, minLength: 1 }
        namedPlace: { type: string, minLength: 1 }
        quantityToleranceUnder: { $ref: '#/components/schemas/Decimal' }
        quantityToleranceOver: { $ref: '#/components/schemas/Decimal' }
        paymentTerms: { type: string, minLength: 1 }
        documentTerms: { type: string, minLength: 1 }
    ContractInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContractInput'
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - reason
            properties:
              reason:
                type: string
                minLength: 3
    ApprovalBinding:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalBinding'
    AllocationReversalInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllocationReversalInput'
    ExpenseCorrectionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseCorrectionInput'
    ClaimOutcomeInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaimOutcomeInput'
    OutboundManifestInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutboundManifestInput'
    AuthenticationInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationInput'
    RoleAssignmentInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleAssignmentInput'
    RestoreTestInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestoreTestInput'
    SupplierShipmentCreateInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupplierShipmentCreateInput'
    SalesShipmentCreateInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SalesShipmentCreateInput'
    SupplierShipmentDatasetRevisionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupplierShipmentDatasetRevisionInput'
    SalesShipmentDatasetRevisionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SalesShipmentDatasetRevisionInput'
    SupplierShipmentExecutionTransitionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupplierShipmentExecutionTransitionInput'
    SalesShipmentExecutionTransitionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SalesShipmentExecutionTransitionInput'
  responses:
    Problem:
      description: RFC 9457; stable codes are defined in problem-details.md
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Entity:
      description: Permission-shaped entity with current version
      headers:
        ETag:
          description: Quoted current version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Entity'
    EntityPage:
      description: Cursor page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityPage'
    Approval:
      description: Fixed-matrix exact-version approval
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Approval'
  schemas:
    OrganizationSettings:
      type: object
      additionalProperties: false
      required: [legalNameEn, legalNameAr, defaultLocale, timeZone]
      properties:
        legalNameEn: { type: string, minLength: 1, maxLength: 160 }
        legalNameAr: { type: string, minLength: 1, maxLength: 160 }
        defaultLocale: { type: string, enum: [en, ar] }
        timeZone: { type: string, minLength: 1, maxLength: 160 }
    NumberingSettings:
      type: object
      additionalProperties: false
      required: [salesContractPrefix, purchaseContractPrefix, salesShipmentPrefix, supplierContainerPrefix]
      properties:
        salesContractPrefix: { type: string, pattern: '^[A-Z][A-Z0-9-]{0,7}$' }
        purchaseContractPrefix: { type: string, pattern: '^[A-Z][A-Z0-9-]{0,7}$' }
        salesShipmentPrefix: { type: string, pattern: '^[A-Z][A-Z0-9-]{0,7}$' }
        supplierContainerPrefix: { type: string, pattern: '^[A-Z][A-Z0-9-]{0,7}$' }
    CompanyProfile:
      type: object
      additionalProperties: false
      description: Company details printed on every document. In an update every field is optional; logoDataUrl null removes the logo.
      properties:
        legalNameEn: { type: string, maxLength: 160 }
        legalNameAr: { type: string, maxLength: 160 }
        addressEn: { type: string, maxLength: 400 }
        addressAr: { type: string, maxLength: 400 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, maxLength: 160 }
        website: { type: string, maxLength: 160 }
        trn: { type: string, maxLength: 20 }
        licenceNo: { type: string, maxLength: 40 }
        bankName: { type: string, maxLength: 120 }
        bankAccountName: { type: string, maxLength: 160 }
        iban: { type: string, maxLength: 40 }
        swift: { type: string, maxLength: 11 }
        bankCurrency: { type: string, maxLength: 3 }
        termsEn: { type: string, maxLength: 1000 }
        termsAr: { type: string, maxLength: 1000 }
        footerEn: { type: string, maxLength: 500 }
        footerAr: { type: string, maxLength: 500 }
        brandColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        documentLanguage: { type: string, enum: [BILINGUAL, EN, AR] }
        vatRegistered: { type: boolean }
        standardVatRate: { type: string }
        logoDataUrl: { type: [string, 'null'] }
    PrintSettings:
      type: object
      additionalProperties: false
      required: [footerEn, footerAr, showLogo]
      properties:
        footerEn: { type: string, minLength: 1, maxLength: 500 }
        footerAr: { type: string, minLength: 1, maxLength: 500 }
