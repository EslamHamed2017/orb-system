          required:
          - verifiedAt
          - verifiedBy
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - projectId
      - sequenceNo
      - actor
      - sessionId
      - action
      - aggregateType
      - aggregateId
      - aggregateVersion
      - beforeHash
      - afterHash
      - previousEventHash
      - occurredAt
      - reason
      - correlationId
      - idempotencyKey
      - eventHash
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sequenceNo:
          type: integer
          minimum: 1
        actor:
          $ref: '#/components/schemas/ActorSnapshot'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        action:
          type: string
          minLength: 1
        aggregateType:
          type: string
          minLength: 1
        aggregateId:
          $ref: '#/components/schemas/Uuid'
        aggregateVersion:
          type: integer
          minimum: 1
        beforeHash:
          oneOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        afterHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        previousEventHash:
          oneOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        eventHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        occurredAt:
          type: string
          format: date-time
        reason:
          type:
          - string
          - 'null'
        correlationId:
          type: string
          minLength: 1
        projectId:
          $ref: '#/components/schemas/Uuid'
        idempotencyKey:
          type:
          - string
          - 'null'
      description: 'eventHash excludes eventHash itself and is lowercase-hex(SHA-256(UTF-8(JCS(hashPayload)))) where hashPayload
        is exactly the RFC 8785 JSON object containing, once each, in any source order: id, projectId, sequenceNo, actor, sessionId,
        action, aggregateType, aggregateId, aggregateVersion, beforeHash, afterHash, previousEventHash, occurredAt, reason, correlationId,
        idempotencyKey. All keys are present; absent optional values are JSON null. JCS determines member order and number/string
        serialization.'
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
      - projectId
      - order
      - canonicalizationStandard
      - textEncoding
      - hashAlgorithm
      - eventHashFormula
      - genesisPreviousEventHash
      - nullAndOmissionRule
      - pageStartPreviousEventHash
      - pageEndEventHash
      - items
      - nextCursor
      properties:
        projectId:
          $ref: '#/components/schemas/Uuid'
        order:
          type: string
          const: sequenceNo ASC
        canonicalizationStandard:
          type: string
          const: RFC 8785 JSON Canonicalization Scheme (JCS)
        textEncoding:
          type: string
          const: UTF-8
        hashAlgorithm:
          type: string
          const: SHA-256
        eventHashFormula:
          type: string
          const: lowercase-hex(SHA-256(UTF-8(JCS(hashPayload))))
        genesisPreviousEventHash:
          type: 'null'
          const: null
        nullAndOmissionRule:
          type: string
          const: Every enumerated hashPayload key is present; unavailable optional values are JSON null; no additional keys are
            hashed.
        pageStartPreviousEventHash:
          oneOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          description: Must equal items[0].previousEventHash. Null only when the page starts with sequenceNo 1.
        pageEndEventHash:
          oneOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          description: Must equal the final item eventHash, or pageStartPreviousEventHash for an empty page; pass as the continuity
            anchor for the next page.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type:
          - string
          - 'null'
      description: For sequenceNo 1 previousEventHash is JSON null. For every later event it equals the immediately preceding
        project eventHash, including across page boundaries. Clients recompute each event using the exact AuditEvent hash-payload
        fields and verify both page anchors.
