    ApprovalInboxItem:
      type: object
      additionalProperties: false
      required:
      - approvalId
      - actionCode
      - subjectType
      - subjectId
      - subjectReference
      - subjectVersion
      - subjectHash
      - changedFields
      - evidence
      - detectedConflicts
      - requester
      - requestedAt
      - requiredRole
      - decisionContext
      - approvalState
      - approvalVersion
      properties:
        approvalId:
          $ref: '#/components/schemas/Uuid'
        actionCode:
          type: string
          enum:
          - CONTRACT_VERSION
          - SUPPLIER_SHIPMENT_CONFIRMATION
          - SALES_SHIPMENT_CONFIRMATION
          - TOLERANCE_EXCEPTION
          - SUPPLIER_INVOICE_CONFIRMATION
          - DIRECT_EXPENSE
          - EXPENSE_CORRECTION
          - DOCUMENT_OUTPUT
          - EXTERNAL_SEND
          - CLAIM_OUTCOME
          - CLOSURE_EXCEPTION
          - FINAL_CLOSE
          - REOPEN
        subjectType:
          type: string
          enum:
          - CONTRACT_VERSION
          - SUPPLIER_SHIPMENT_DATASET
          - SALES_SHIPMENT_DATASET
          - TOLERANCE_EXCEPTION
          - SUPPLIER_INVOICE
          - DIRECT_EXPENSE
          - EXPENSE_CORRECTION
          - DOCUMENT_REVISION
          - OUTBOUND_MANIFEST
          - CLAIM_OUTCOME_PROPOSAL
          - CLOSURE_ASSESSMENT
          - PROJECT
        subjectId:
          $ref: '#/components/schemas/Uuid'
        subjectReference:
          type: string
          minLength: 1
        subjectVersion:
          type: integer
          minimum: 1
        subjectHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        changedFields:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - fieldPath
            - before
            - after
            - displayLabel
            properties:
              fieldPath:
                type: string
                minLength: 1
              displayLabel:
                type: string
                minLength: 1
              before: {}
              after: {}
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceMetadata'
        detectedConflicts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - severity
            - message
            - subjectType
            - subjectId
            properties:
              code:
                type: string
                minLength: 1
              severity:
                type: string
                enum:
                - INFO
                - WARNING
                - BLOCKING
              message:
                type: string
                minLength: 1
              subjectType:
                type: string
                minLength: 1
              subjectId:
                $ref: '#/components/schemas/Uuid'
        requester:
          $ref: '#/components/schemas/ActorSnapshot'
        requestedAt:
          type: string
          format: date-time
        requiredRole:
          type: string
          const: OWNER_ADMIN
        decisionContext:
          type: object
          additionalProperties: false
          required:
          - summary
          - reason
          - consequences
          - proposedOutcome
          - selfApprovalAllowed
          properties:
            summary:
              type: string
              minLength: 1
            reason:
              type:
              - string
              - 'null'
            consequences:
              type: array
              items:
                type: string
                minLength: 1
            proposedOutcome:
              type:
              - string
              - 'null'
            selfApprovalAllowed:
              type: boolean
              const: false
        approvalState:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        approvalVersion:
          type: integer
          minimum: 1
