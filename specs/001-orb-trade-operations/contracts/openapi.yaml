components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-orb_session
      description: Secure HttpOnly __Host- cookie; SameSite=Strict, Path=/, no Domain; rotation and expiry are defined by
        x-cookie-auth-policy.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ManifestId:
      name: manifestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MovementId:
      name: movementId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MasterType:
      name: masterType
      in: path
      required: true
      schema:
        type: string
        enum:
        - customers
        - suppliers
        - coffee
        - currencies
        - expense-categories
    StatementType:
      name: statementType
      in: path
      required: true
      schema:
        type: string
        enum:
        - customer
        - supplier
        - sales-shipment
        - supplier-shipment
        - project
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current aggregate version
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RestoreTestId:
      name: restoreTestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Unpredictable token bound to the authenticated session; required with Origin/Referer fail-closed validation.
      schema:
        type: string
        minLength: 32
        maxLength: 256
  requestBodies:
    EntityInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: true
    ContractLineInput:
      type: object
      additionalProperties: false
      required:
      - contractVersionId
      - coffeeSpecificationId
      - quantity
      - unitPrice
      - currency
      - incoterm
      - namedPlace
      - quantityToleranceUnder
      - quantityToleranceOver
      - paymentTerms
      - documentTerms
      properties:
        contractVersionId: { $ref: '#/components/schemas/Uuid' }
        coffeeSpecificationId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        unitPrice: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/Currency' }
        incoterm: { type: string, minLength: 1 }
        namedPlace: { type: string, minLength: 1 }
        quantityToleranceUnder: { $ref: '#/components/schemas/Decimal' }
        quantityToleranceOver: { $ref: '#/components/schemas/Decimal' }
        paymentTerms: { type: string, minLength: 1 }
        documentTerms: { type: string, minLength: 1 }
    ContractInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContractInput'
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - reason
            properties:
              reason:
                type: string
                minLength: 3
    ApprovalBinding:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalBinding'
    AllocationReversalInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllocationReversalInput'
    ExpenseCorrectionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseCorrectionInput'
    ClaimOutcomeInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaimOutcomeInput'
    OutboundManifestInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutboundManifestInput'
    AuthenticationInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationInput'
    RoleAssignmentInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleAssignmentInput'
    RestoreTestInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestoreTestInput'
    SupplierShipmentCreateInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupplierShipmentCreateInput'
    SalesShipmentCreateInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SalesShipmentCreateInput'
    SupplierShipmentDatasetRevisionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupplierShipmentDatasetRevisionInput'
    SalesShipmentDatasetRevisionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SalesShipmentDatasetRevisionInput'
    SupplierShipmentExecutionTransitionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupplierShipmentExecutionTransitionInput'
    SalesShipmentExecutionTransitionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SalesShipmentExecutionTransitionInput'
  responses:
    Problem:
      description: RFC 9457; stable codes are defined in problem-details.md
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Entity:
      description: Permission-shaped entity with current version
      headers:
        ETag:
          description: Quoted current version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Entity'
    EntityPage:
      description: Cursor page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityPage'
    Approval:
      description: Fixed-matrix exact-version approval
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Approval'
  schemas:
    Uuid:
      type: string
      format: uuid
    Decimal:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]+)?$
    Currency:
      type: string
      pattern: ^[A-Z]{3}$
    TradeRoute:
      type: string
      enum:
      - FOREIGN_TO_FOREIGN
      - UAE_FREE_ZONE_REEXPORT
      - UAE_IMPORT
    Entity:
      type: object
      required:
      - id
      - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
      additionalProperties: true
    EntityPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        nextCursor:
          type:
          - string
          - 'null'
    CreateProject:
      type: object
      additionalProperties: false
      required:
      - customerId
      - salesContract
      properties:
        customerId:
          $ref: '#/components/schemas/Uuid'
        salesContract:
          $ref: '#/components/schemas/ContractInput'
    ContractLineInput:
      type: object
      additionalProperties: false
      required:
      - contractVersionId
      - coffeeSpecificationId
      - quantity
      - unitPrice
      - currency
      - incoterm
      - namedPlace
      - quantityToleranceUnder
      - quantityToleranceOver
      - paymentTerms
      - documentTerms
      properties:
        contractVersionId: { $ref: '#/components/schemas/Uuid' }
        coffeeSpecificationId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        unitPrice: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/Currency' }
        incoterm: { type: string, minLength: 1 }
        namedPlace: { type: string, minLength: 1 }
        quantityToleranceUnder: { $ref: '#/components/schemas/Decimal' }
        quantityToleranceOver: { $ref: '#/components/schemas/Decimal' }
        paymentTerms: { type: string, minLength: 1 }
        documentTerms: { type: string, minLength: 1 }
    ContractInput:
      type: object
      required:
      - counterpartyId
      - coffeeSpecificationId
      - quantity
      - unitPrice
      - currency
      - route
      - incoterm
      - namedPlace
      properties:
        counterpartyId:
          $ref: '#/components/schemas/Uuid'
        coffeeSpecificationId:
          $ref: '#/components/schemas/Uuid'
        quantity:
          $ref: '#/components/schemas/Decimal'
        unitPrice:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
        route:
          $ref: '#/components/schemas/TradeRoute'
        incoterm:
          type: string
          minLength: 3
        namedPlace:
          type: string
          minLength: 1
        tolerances:
          type: object
          description: Omitted values persist as zero
          properties:
            quantityUnder:
              $ref: '#/components/schemas/Decimal'
            quantityOver:
              $ref: '#/components/schemas/Decimal'
            netWeightUnder:
              $ref: '#/components/schemas/Decimal'
            netWeightOver:
              $ref: '#/components/schemas/Decimal'
            grossWeightUnder:
              $ref: '#/components/schemas/Decimal'
            grossWeightOver:
              $ref: '#/components/schemas/Decimal'
    GenerateDocument:
      type: object
      additionalProperties: false
      required:
      - kind
      - language
      - sourceDatasetId
      properties:
        kind:
          type: string
          enum:
          - CINV
          - PACKING_LIST
        language:
          type: string
          enum:
          - AR
          - EN
          - BILINGUAL
        sourceDatasetId:
          $ref: '#/components/schemas/Uuid'
    OutboundManifestInput:
      type: object
      additionalProperties: false
      required:
      - documentRevisionId
      - documentRevisionVersion
      - outputSha256
      - channel
      - to
      - cc
      - attachments
      - subject
      - body
      properties:
        documentRevisionId:
          $ref: '#/components/schemas/Uuid'
        documentRevisionVersion:
          type: integer
          minimum: 1
        outputSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        channel:
          type: string
          enum:
          - EMAIL
        to:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: email
        cc:
          type: array
          uniqueItems: true
          items:
            type: string
            format: email
        attachments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OutboundAttachment'
        subject:
          type: string
          minLength: 1
        body:
          $ref: '#/components/schemas/OutboundBody'
      description: Server verifies all lengths/hashes, canonicalizes ordered recipient/attachment fields, and computes manifestHash.
        Approved manifests are immutable.
    ApprovalBinding:
      type: object
      additionalProperties: false
      required:
      - approvalId
      properties:
        approvalId:
          $ref: '#/components/schemas/Uuid'
    ApprovalDecision:
      type: object
      additionalProperties: false
      required:
      - decision
      - comment
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        comment:
          type: string
          minLength: 1
    Approval:
      type: object
      required:
      - id
      - actionCode
      - subjectId
      - subjectVersion
      - subjectHash
      - requesterId
      - decision
      - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        actionCode:
          type: string
          enum:
          - CONTRACT_VERSION
          - SUPPLIER_SHIPMENT_CONFIRMATION
          - SALES_SHIPMENT_CONFIRMATION
          - TOLERANCE_EXCEPTION
          - SUPPLIER_INVOICE_CONFIRMATION
          - DIRECT_EXPENSE
          - EXPENSE_CORRECTION
          - DOCUMENT_OUTPUT
          - EXTERNAL_SEND
          - CLAIM_OUTCOME
          - CLOSURE_EXCEPTION
          - FINAL_CLOSE
          - REOPEN
        subjectId:
          $ref: '#/components/schemas/Uuid'
        subjectVersion:
          type: integer
          minimum: 1
        subjectHash:
          type: string
        requesterId:
          $ref: '#/components/schemas/Uuid'
        decision:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    SupplierInvoiceInput:
      type: object
      additionalProperties: false
      required:
      - supplierId
      - reference
      - invoiceDate
      - amount
      - currency
      - evidenceId
      properties:
        supplierId:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        invoiceDate:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
        evidenceId:
          $ref: '#/components/schemas/Uuid'
    MoneyMovementInput:
      type: object
      required:
      - partyId
      - contractId
