        revocationReason:
          type: string
          const: USER_SIGN_OUT
        version:
          type: integer
          minimum: 1
x-cookie-auth-policy:
  cookie:
    name: __Host-orb_session
    secure: true
    httpOnly: true
    sameSite: Strict
    path: /
    domainAttributeAllowed: false
  csrf:
    header: X-CSRF-Token
    requiredFor: all cookie-authenticated POST, PUT, PATCH and DELETE operations
    binding: session and authenticated origin
    rotateOn:
    - SIGN_IN
    - REAUTHENTICATION
    - PRIVILEGE_CHANGE
    expiresWithSession: true
  requestSourceValidation:
    originRequired: true
    refererRequiredWhenOriginUnavailable: true
    allowedOrigins: deployment allow-list only
    failureMode: fail closed before mutation
  session:
    idleExpiryMinutes: 30
    absoluteExpiryHours: 12
    revokeInvalidatesImmediately: true
